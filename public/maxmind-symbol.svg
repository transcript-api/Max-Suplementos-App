<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" fill="none">
  <!-- MAXMIND Pure Transparent Vector Symbol -->
  <defs>
    <!-- Royal Blue Gradient for Upper Facets -->
    <linearGradient id="maxmind-blue-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <!-- Deep Midnight Navy / Carbon Gradient for Front Facets -->
    <linearGradient id="maxmind-navy-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <!-- Dark Mode Luminous Blue Gradient -->
    <linearGradient id="maxmind-glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <g id="maxmind-symbol-emblem" transform="translate(250, 180)">
    <!-- LEFT HALF -->
    <!-- Outer Vertical Pillar -->
    <!-- Left edge vertical, top cut angled down-right, bottom cut angled up-right -->
    <polygon 
      points="-160,-65 -118,-115 -118,50 -160,105" 
      fill="url(#maxmind-navy-front)" 
    />

    <!-- Inner Diagonal Upper Bevel (Vibrant Royal Blue) -->
    <polygon 
      points="-112,-160 -8,-35 -8,-8 -112,-132" 
      fill="url(#maxmind-blue-upper)" 
    />

    <!-- Inner Diagonal Front Face (Deep Navy) -->
    <polygon 
      points="-112,-132 -8,-8 -8,105 -112,-15" 
      fill="url(#maxmind-navy-front)" 
    />

    <!-- RIGHT HALF (Symmetric Mirror) -->
    <!-- Outer Vertical Pillar -->
    <polygon 
      points="160,-65 118,-115 118,50 160,105" 
      fill="url(#maxmind-navy-front)" 
    />

    <!-- Inner Diagonal Upper Bevel (Vibrant Royal Blue) -->
    <polygon 
      points="112,-160 8,-35 8,-8 112,-132" 
      fill="url(#maxmind-blue-upper)" 
    />

    <!-- Inner Diagonal Front Face (Deep Navy) -->
    <polygon 
      points="112,-132 8,-8 8,105 112,-15" 
      fill="url(#maxmind-navy-front)" 
    />
  </g>
</svg>
